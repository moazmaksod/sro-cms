services:
  # Application Container (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: sro-cms-app
    restart: unless-stopped
    working_dir: /var/www/html
    # 'extra_hosts' allows the container to resolve 'host.docker.internal'
    # to the IP address of the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_data:/var/www/html/node_modules
    networks:
      - sro-cms-network

nginx:
    image: nginx:alpine
    container_name: sro-cms-nginx
    restart: unless-stopped
    ports:
      - "80:80"  # تغيير المنفذ إلى 80 ليعمل الدومين مباشرة بدون كتابة :8000
    environment:
      - APP_URL=${APP_URL:-localhost} # يمرر الرابط من ملف .env
    volumes:
      - ./:/var/www/html
      # تم تغيير مسار الربط ليصبح قالب (Template)
      - ./.docker/nginx.conf:/etc/nginx/templates/default.conf.template
    depends_on:
      - app
    networks:
      - sro-cms-network

# Docker Networks
networks:
  sro-cms-network:
    driver: bridge

# Docker Volumes for persisting dependencies
volumes:
  vendor_data:
    driver: local
  node_data:
    driver: local

